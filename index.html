<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src https:; img-src data:; base-uri 'none'; form-action 'none'">
<title>Dorax Wallet</title>
<style>
:root{--bg:#f3f6fc;--card:#fff;--sur:#e9effb;--ink:#0f1a33;--mute:#6b7a99;--line:#e3e9f6;--acc:#1f5af6;--accink:#fff;--warn:#fff4dc;--warnink:#7a4a05;--bad:#d92d20;--ok:#16a34a;--link:#1f5af6;--sh:0 10px 28px -16px rgba(31,64,160,.35)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1226;--card:#141d36;--sur:#1b2644;--ink:#eef2fc;--mute:#8d9bbd;--line:#243153;--acc:#4d86ff;--warn:#2d2410;--warnink:#f0c987;--bad:#ff7a6e;--ok:#3ccf74;--link:#7aa5ff;--sh:0 10px 28px -16px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(90% 40% at 50% -5%,rgba(31,90,246,.13),transparent 70%);background-repeat:no-repeat}
#app{max-width:480px;margin:0 auto;padding:14px 18px 56px}
.pg{animation:fade .22s ease both}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:26px;line-height:1.2;margin:6px 0;letter-spacing:-.015em}
h2{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:600}
.sub,.note{color:var(--mute);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:14px 0;box-shadow:var(--sh)}
.card.warn{background:var(--warn);color:var(--warnink);font-size:14px;box-shadow:none}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:600}
input,textarea,select{width:100%;padding:13px 14px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:96px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(31,90,246,.18)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=checkbox]{width:auto;margin-right:8px}
button{width:100%;padding:14px;margin-top:12px;font:inherit;font-weight:600;color:var(--accink);background:var(--acc);border:0;border-radius:14px;cursor:pointer;transition:transform .15s ease,filter .2s ease,background .2s ease}
button:hover{filter:brightness(1.06)}button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:default}
button.alt{background:var(--sur);color:var(--ink)}
button.danger{color:var(--bad)}
button.sm{width:auto;padding:8px 14px;font-size:14px;margin-top:8px;border-radius:999px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand svg{width:30px;height:30px;stroke:none}
.welcome{text-align:center;padding:34px 0 6px}
.bigmark svg{width:76px;height:76px;stroke:none;filter:drop-shadow(0 14px 20px rgba(31,90,246,.35))}
.addr,.bal{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.words{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.words span{background:var(--card);border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;box-shadow:var(--sh)}
.words i{color:var(--mute);font-style:normal;margin-right:8px;font-size:13px}
.msg{margin-top:10px;font-size:14px;word-break:break-word}.err{color:var(--bad)}.ok{color:var(--ok)}
a{color:var(--link);font-weight:600;text-decoration:none}
.hdr{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px}
.pill{display:flex;align-items:center;gap:8px;width:auto;margin:0;padding:8px 12px;border-radius:999px;background:var(--card);color:var(--ink);font-size:14px;box-shadow:var(--sh);max-width:62%}
.pill i{width:10px;height:10px;border-radius:50%;flex:none}
.pill svg{width:16px;height:16px;flex:none}
.bc{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:18px;background:linear-gradient(135deg,#1f5af6 0%,#4a7dff 60%,#7ea0ff 100%);box-shadow:0 22px 34px -18px rgba(31,90,246,.7)}
.bc:after{content:"";position:absolute;right:-50px;bottom:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.bc>*{position:relative;z-index:1}
.bt1{display:flex;justify-content:space-between;align-items:center}
.acc{display:flex;align-items:center;gap:10px}
.avt{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.an{font-weight:600;line-height:1.2}
.ad{width:auto;margin:0;padding:0;background:none;color:rgba(255,255,255,.8);font-size:13px;font-weight:500;font-family:ui-monospace,Menlo,Consolas,monospace}
.ib{width:40px;height:40px;margin:0;padding:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center}
.ib svg,.ti svg{width:20px;height:20px}
.bl{margin:20px 0 4px}.bl span{font-size:13px;opacity:.85}
.bv{font-size:36px;font-weight:700;letter-spacing:-.02em;word-break:break-word;line-height:1.15}
.bv small{font-size:17px;opacity:.85;font-weight:600}
.ac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.ab{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0;padding:12px 6px;background:rgba(255,255,255,.2);color:#fff;border-radius:16px;font-size:13px}
.ab svg{width:20px;height:20px}
.tabs{display:flex;gap:4px;background:var(--sur);padding:4px;border-radius:16px;margin:18px 0 12px}
.tabs button{flex:1;margin:0;padding:10px 4px;background:none;color:var(--mute);border-radius:12px;font-size:14px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.list{background:var(--card);border-radius:18px;padding:2px 14px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.list>.row:last-child,.list #tk>.row:last-child{border-bottom:0}
.ti{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-weight:700}
.ti.in{background:rgba(22,163,74,.15);color:var(--ok)}
.ti.out{background:var(--sur);color:var(--ink)}
.ti.eth{background:#627eea}
.rm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.rm span{font-size:12px;color:var(--mute)}
.rb{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.rb.pos{color:var(--ok)}
.tl{width:auto;margin:2px 0 0;padding:0;background:none;color:var(--mute);font-size:12px;font-weight:500;text-align:left}
.vl{font-size:12px}
.lnk{background:var(--card);color:var(--link);box-shadow:var(--sh);margin-top:12px}
.srow{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--card);color:var(--ink);margin:10px 0 0;font-weight:500;box-shadow:var(--sh)}
.srow.dng{color:var(--bad)}
.bar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.bt{font-weight:700;font-size:17px}
.back{width:40px;height:40px;margin:0;padding:0;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:var(--sh)}
.back svg{width:22px;height:22px}.sp{width:40px}
.fm{padding-top:4px}
.in2{display:flex;gap:8px}.in2 input{flex:1}
.pb{width:auto;margin:0;padding:0 16px;background:var(--sur);color:var(--link)}
.nrow{display:flex;align-items:center;background:var(--card);border-radius:16px;margin:8px 0;box-shadow:var(--sh)}
.nsel{display:flex;align-items:center;gap:12px;flex:1;margin:0;background:none;color:var(--ink);text-align:left;font-weight:500;min-width:0}
.nd{width:34px;height:34px;border-radius:50%;flex:none}
.nsel span:nth-child(2){display:flex;flex-direction:column;line-height:1.3;min-width:0}
.nsel small{color:var(--mute);font-weight:400}
.chk{color:var(--acc);font-weight:700;margin-left:auto}
.nrm{width:auto;margin:0 12px 0 0;padding:6px 10px;background:none;color:var(--bad);font-size:13px}
.cfm{text-align:center;padding:14px 0 6px}
.ca{font-size:36px;font-weight:700;word-break:break-word}.ca small{font-size:18px;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--mute);flex:none}.kv b{text-align:right;font-weight:600;min-width:0}
.rcv{text-align:center;padding-top:10px}
.qrbox{display:inline-block;background:#fff;padding:14px;border-radius:20px;line-height:0;box-shadow:var(--sh)}
.stage{text-align:center;padding-top:36px}
.sico{position:relative;width:96px;height:96px;margin:30px auto 22px}
.ring{position:absolute;inset:0;border-radius:50%;border:4px solid var(--sur);border-top-color:var(--acc);animation:spin 1s linear infinite}
.arr{position:absolute;left:28px;top:28px;width:40px;height:40px;color:var(--acc);animation:rise 1.3s ease-in-out infinite}
.ck,.xx{position:absolute;inset:0;width:96px;height:96px;display:none;stroke-width:3}
.ck{color:var(--ok)}.xx{color:var(--bad)}
.ck circle,.xx circle{stroke-dasharray:152;stroke-dashoffset:152;animation:draw .6s ease forwards}
.ck path,.xx path{stroke-dasharray:50;stroke-dashoffset:50;animation:draw .4s .5s ease forwards}
[data-k=ok] .ring,[data-k=ok] .arr,[data-k=fail] .ring,[data-k=fail] .arr{display:none}
[data-k=ok] .ck,[data-k=fail] .xx{display:block}
[data-k=wait] .ring{animation-duration:1.8s}
[data-k=pend] .ring,[data-k=pend] .arr{animation:none}
.st{font-size:22px;font-weight:700}.ss{color:var(--mute);margin:4px 0 18px;word-break:break-word}
.steps{display:flex;justify-content:center;gap:18px;margin:6px 0 14px;font-size:12px;color:var(--mute)}
.steps div{display:flex;align-items:center;gap:6px}
.steps i{width:10px;height:10px;border-radius:50%;background:var(--sur)}
.steps .on{color:var(--ink)}.steps .on i{background:var(--ok)}
.steps .cur i{background:var(--acc);animation:pulse 1.2s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{0%,100%{transform:translateY(4px);opacity:.55}50%{transform:translateY(-4px);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const $ = s => document.querySelector(s);
const BUILTIN = {
  mainnet: { name: 'Ethereum', id: 1, rpc: 'https://ethereum-rpc.publicnode.com', sym: 'ETH', scan: 'https://etherscan.io', c: '#627eea' },
  bsc: { name: 'BNB Smart Chain', id: 56, rpc: 'https://bsc-rpc.publicnode.com', sym: 'BNB', scan: 'https://bscscan.com', c: '#f0b90b' },
  polygon: { name: 'Polygon', id: 137, rpc: 'https://polygon-bor-rpc.publicnode.com', sym: 'POL', scan: 'https://polygonscan.com', c: '#8247e5' },
  arbitrum: { name: 'Arbitrum One', id: 42161, rpc: 'https://arbitrum-one-rpc.publicnode.com', sym: 'ETH', scan: 'https://arbiscan.io', c: '#28a0f0' },
  optimism: { name: 'Optimism', id: 10, rpc: 'https://optimism-rpc.publicnode.com', sym: 'ETH', scan: 'https://optimistic.etherscan.io', c: '#ff0420' },
  base: { name: 'Base', id: 8453, rpc: 'https://base-rpc.publicnode.com', sym: 'ETH', scan: 'https://basescan.org', c: '#0052ff' },
  avalanche: { name: 'Avalanche C-Chain', id: 43114, rpc: 'https://avalanche-c-chain-rpc.publicnode.com', sym: 'AVAX', scan: 'https://snowtrace.io', c: '#e84142' },
  sepolia: { name: 'Sepolia', id: 11155111, rpc: 'https://ethereum-sepolia-rpc.publicnode.com', sym: 'SepETH', scan: 'https://sepolia.etherscan.io', test: 1, c: '#627eea' },
  bsctest: { name: 'BNB Testnet', id: 97, rpc: 'https://bsc-testnet-rpc.publicnode.com', sym: 'tBNB', scan: 'https://testnet.bscscan.com', test: 1, c: '#f0b90b' },
  amoy: { name: 'Polygon Amoy', id: 80002, rpc: 'https://polygon-amoy-bor-rpc.publicnode.com', sym: 'POL', scan: 'https://amoy.polygonscan.com', test: 1, c: '#8247e5' },
  basesep: { name: 'Base Sepolia', id: 84532, rpc: 'https://base-sepolia-rpc.publicnode.com', sym: 'SepETH', scan: 'https://sepolia.basescan.org', test: 1, c: '#0052ff' }
};
const NKEY = 'mywallet.nets.v1';
let NETS = {};
function customNets() { try { return JSON.parse(localStorage.getItem(NKEY)) || []; } catch { return []; } }
function buildNets() { NETS = { ...BUILTIN }; customNets().forEach(n => { NETS['c' + n.id] = n; }); }
const KEY = 'mywallet.v1';
let wallet = null, net = 'sepolia', timer = null, temp = {};
buildNets();
try { const k = localStorage.getItem('mywallet.net'); if (k && NETS[k]) net = k; } catch {}
function setNet(k) { net = k; try { localStorage.setItem('mywallet.net', k); } catch {} }
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
const save = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); return true; } catch { return false; } };
const mk = s => s.t === 'm' ? ethers.Wallet.fromPhrase(s.v) : new ethers.Wallet(s.v);
const wait = () => new Promise(r => setTimeout(r, 40));

const LOGO = '<svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#1f5af6"/></linearGradient></defs><rect width="32" height="32" rx="10" fill="url(#lg)"/><path d="M11 9h6a7 7 0 010 14h-6z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>';
function show(h, right) {
  const bar = right === null ? '' : '<div class="top"><div class="brand">' + LOGO + '<span>Dorax</span></div>' + (right || '') + '</div>';
  $('#app').innerHTML = '<div class="pg">' + bar + h + '</div>'; window.scrollTo(0, 0);
}
function msg(id, t, ok) { const e = $('#' + id); if (e) { e.textContent = t; e.className = 'msg ' + (ok ? 'ok' : 'err'); } }
async function copyText(t, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch {}
  if (!ok) {
    const a = document.createElement('textarea');
    a.value = t; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(a); a.focus(); a.select(); a.setSelectionRange(0, t.length);
    try { ok = document.execCommand('copy'); } catch {}
    a.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = ok ? 'Copied' : 'Copy failed: press and hold the text'; setTimeout(() => btn.textContent = o, 2000); }
}

/* ---- encryption: PBKDF2 (600k) + AES-GCM, all in the browser ---- */
async function dk(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(secret, address, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000;
  const k = await dk(pw, salt, iter);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc.encode(JSON.stringify(secret)));
  return { v: 1, address, iter, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}
async function openSeal(r, pw) {
  const k = await dk(pw, unb64(r.salt), r.iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(r.iv) }, k, unb64(r.ct));
  return JSON.parse(dec.decode(pt));
}

/* ---- screens ---- */
function home() {
  const s = load();
  if (s && s.ct) return unlockView();
  show(`<div class="welcome"><div class="bigmark">${LOGO}</div><h1>Dorax Wallet</h1><p class="sub">A self-custody wallet. Your keys stay on this device. No account, no server holding your funds.</p></div>
  <div class="card"><button onclick="createView()">Create new wallet</button>
  <button class="alt" onclick="importView()">Import recovery phrase or private key</button>
  <button class="alt" onclick="restoreView()">Restore from encrypted backup</button></div>
  <p class="note">Practice on Sepolia first. Do not keep real funds here until the app has had a security review.</p>`, null);
}

function createView() {
  show(`<h1>Create wallet</h1><div class="card">
  <label>Password (at least 10 characters)</label><input id="p1" type="password" autocomplete="new-password">
  <label>Repeat password</label><input id="p2" type="password" autocomplete="new-password">
  <p class="note">The password only unlocks the wallet on this device. It cannot recover funds. Your recovery phrase can.</p>
  <button onclick="createNext()">Continue</button><button class="alt" onclick="home()">Back</button><div id="m"></div></div>`);
}
function createNext() {
  const a = $('#p1').value, b = $('#p2').value;
  if (a.length < 10) return msg('m', 'Use at least 10 characters.');
  if (a !== b) return msg('m', 'The passwords do not match.');
  const w = ethers.Wallet.createRandom();
  temp = { pw: a, phrase: w.mnemonic.phrase, address: w.address };
  phraseView();
}
function phraseView() {
  const words = temp.phrase.split(' ');
  show(`<h1>Recovery phrase</h1>
  <div class="card warn">Write these 12 words on paper, in order. Anyone who has them controls your funds. If you lose them and forget the password, the funds are gone for good. No screenshots, no cloud notes.</div>
  <div class="words">${words.map((w, i) => `<span><i>${i + 1}</i>${w}</span>`).join('')}</div>
  <button onclick="verifyView()">I wrote it down</button>`);
}
function verifyView() {
  const idx = [...Array(12).keys()].sort(() => Math.random() - .5).slice(0, 3).sort((a, b) => a - b);
  temp.idx = idx;
  show(`<h1>Check your copy</h1><div class="card">
  ${idx.map(i => `<label>Word number ${i + 1}</label><input class="vw" autocapitalize="none" autocomplete="off" spellcheck="false">`).join('')}
  <button onclick="verifyDone()">Check and create wallet</button>
  <button class="alt" onclick="phraseView()">Show the phrase again</button><div id="m"></div></div>`);
}
async function verifyDone() {
  const words = temp.phrase.split(' '), ins = [...document.querySelectorAll('.vw')];
  if (!ins.every((x, k) => x.value.trim().toLowerCase() === words[temp.idx[k]])) return msg('m', 'A word is wrong. Compare with your paper copy.');
  msg('m', 'Encrypting...', 1); await wait();
  await finish({ t: 'm', v: temp.phrase }, temp.address, temp.pw);
}
async function finish(secret, address, pw) {
  const rec = await seal(secret, address, pw);
  if (!save(rec)) return alert('This browser blocked storage (private mode?). The wallet was not saved.');
  wallet = mk(secret); temp = {};
  mainView();
}

function importView() {
  show(`<h1>Import wallet</h1><div class="card">
  <p class="note">Paste your 12 or 24 word phrase, or a private key. A wallet already stored here will be replaced.</p>
  <label>Recovery phrase or private key</label><textarea id="sec" autocapitalize="none" autocomplete="off" spellcheck="false"></textarea>
  <label>New password (at least 10 characters)</label><input id="p1" type="password" autocomplete="new-password">
  <button onclick="importDo()">Import</button><button class="alt" onclick="home()">Back</button><div id="m"></div></div>`);
}
async function importDo() {
  const raw = $('#sec').value.trim(), pw = $('#p1').value;
  if (pw.length < 10) return msg('m', 'Use a password of at least 10 characters.');
  let secret;
  if (/^(0x)?[0-9a-fA-F]{64}$/.test(raw)) secret = { t: 'k', v: raw.startsWith('0x') ? raw : '0x' + raw };
  else {
    const p = raw.toLowerCase().split(/\s+/).join(' ');
    if (!ethers.Mnemonic.isValidMnemonic(p)) return msg('m', 'Not a valid recovery phrase or private key.');
    secret = { t: 'm', v: p };
  }
  msg('m', 'Encrypting...', 1); await wait();
  await finish(secret, mk(secret).address, pw);
}

function unlockView() {
  const s = load();
  show(`<div class="welcome"><div class="bigmark">${LOGO}</div><h1>Welcome back</h1><p class="sub addr" style="user-select:none">${esc(short(s.address))}</p></div><div class="card">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">

  <div class="card"><h2>Forgot the password?</h2>

}
function steps(n) { return '<div class="steps">' + ['Signed', 'Broadcast', 'Confirmed'].map((x, i) => `<div class="${i < n ? 'on' : i === n ? 'cur' : ''}"><i></i>${x}</div>`).join('') + '</div>'; }
async function sendNow() {
  if (temp.busy) return;
  temp.busy = true;
  const p = prov(), t = temp.tx, id = NETS[net].id, link = NETS[net].scan, what = t.amt + ' ' + t.sym + ' to ' + short(t.to);
  const done = tb => `<button onclick="${tb}">Done</button>`;
  show(`<div class="stage" id="stg" data-k="send"><div class="sico"><div class="ring"></div><svg class="arr" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg><svg class="ck" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l8 8 14-16"/></svg><svg class="xx" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M18 18l16 16M34 18L18 34"/></svg></div><div class="st" id="stt"></div><div class="ss" id="sts"></div><div id="stx"></div></div>`, null);
  stg('send', 'Sending', what, steps(0));
  let tx;
  try {
    const w = wallet.connect(p);
    tx = t.tk ? await new ethers.Contract(t.tk.a, ERC20, w).transfer(t.to, t.v) : await w.sendTransaction({ to: t.to, value: t.v });
  } catch (e) {
    temp.busy = false;
    stg('fail', 'Not sent', e.shortMessage || e.message, '<button onclick="sendView()">Back</button>');
    p.destroy(); return;
  }
  addHist({ h: tx.hash, c: id, f: wallet.address, to: t.to, a: t.amt, s: t.sym, t: Date.now(), st: 'pending' });
  const view = link ? `<a class="vl" style="font-size:14px" href="${link}/tx/${tx.hash}" target="_blank" rel="noopener">View on explorer</a>` : '';
  const fin = "temp.form=null;tab='activity';mainView()";
  stg('wait', 'Waiting for confirmation', what, steps(2) + view);
  try {
    const r = await waitTx(p, tx.hash, 180000);
    if (!r) stg('pend', 'Still pending', 'It may confirm later. Check the Activity tab.', steps(2) + view + done(fin));
    else {
      const ok = r.status === 1;
      setHist(tx.hash, ok ? 'ok' : 'fail'); renderHist();
      stg(ok ? 'ok' : 'fail', ok ? 'Sent' : 'Transaction failed', what, (ok ? steps(3) : '') + view + done(fin));
    }
  } catch { stg('pend', 'Still pending', 'It may confirm later. Check the Activity tab.', steps(2) + view + done(fin)); }
  p.destroy();
}

function secView() {
  show(`<h1>Show secrets</h1><div class="card warn">Make sure nobody can see your screen.</div><div class="card">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button onclick="secShow()">Show</button><button class="alt" onclick="mainView()">Back</button><div id="m"></div></div>`);
}
async function secShow() {
  msg('m', 'Checking...', 1); await wait();
  try {
    const s = await openSeal(load(), $('#pw').value), w = mk(s);
    show(`<h1>Your secrets</h1><div class="card warn">Never share these or type them into any website. Hide this screen when done.</div>
    ${s.t === 'm' ? `<div class="words">${s.v.split(' ').map((x, i) => `<span><i>${i + 1}</i>${x}</span>`).join('')}</div>` : '<p class="note">This wallet was imported from a private key, so it has no phrase.</p>'}
    <div class="card"><label>Private key</label><div class="addr">${w.privateKey}</div></div>
    <button onclick="mainView()">Hide</button>`);
  } catch { msg('m', 'Wrong password.'); }
}

function backupView() {
  show(`<h1>Encrypted backup</h1><div class="card">
  <p class="note">This text is your wallet encrypted with your password. Save it somewhere safe. Restoring needs this text and the password. It does not replace your recovery phrase.</p>
  <textarea id="bk" readonly>${esc(JSON.stringify(load()))}</textarea>
  <button onclick="copyText($('#bk').value, this)">Copy backup</button><button class="alt" onclick="mainView()">Back</button></div>`);
}
function restoreView() {
  show(`<h1>Restore backup</h1><div class="card"><label>Paste the encrypted backup text</label><textarea id="bk"></textarea>
  <button onclick="restoreDo()">Restore</button><button class="alt" onclick="home()">Back</button><div id="m"></div></div>`);
}
function restoreDo() {
  try {
    const r = JSON.parse($('#bk').value.trim());
    const ok = r.v === 1 && ethers.isAddress(r.address) && r.iter >= 100000 && r.iter <= 5000000 && r.salt && r.iv && r.ct;
    if (!ok) throw 0;
    if (!save({ v: 1, address: r.address, iter: r.iter, salt: r.salt, iv: r.iv, ct: r.ct })) return msg('m', 'Could not save in this browser.');
    unlockView();
  } catch { msg('m', 'This is not a valid backup.'); }
}

function wipeView() {
  show(`<h1>Remove wallet</h1><div class="card warn">This deletes the wallet from this device. You can only get it back with your recovery phrase or backup. Make sure you have one.</div>
  <div class="card"><label>Type DELETE to confirm</label><input id="c" autocapitalize="characters" autocomplete="off">
  <button class="danger alt" onclick="wipeDo()">Remove wallet</button><button onclick="mainView()">Cancel</button><div id="m"></div></div>`);
}
function wipeDo() {
  if ($('#c').value.trim() !== 'DELETE') return msg('m', 'Type DELETE exactly.');
  try { localStorage.removeItem(KEY); } catch {}
  wallet = null; clearTimeout(timer); home();
}

if (!window.ethers) show('<h1>My Wallet</h1><div class="card warn">Could not load the ethers library. Check your internet connection and reload.</div>');
else if (!window.crypto || !crypto.subtle) show('<h1>My Wallet</h1><div class="card warn">This page needs a secure connection (https). Open it from GitHub Pages or localhost.</div>');
else home();
</script>
</body>
